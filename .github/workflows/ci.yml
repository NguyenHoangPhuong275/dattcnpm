name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MONGODB_URI: mongodb://localhost:27017/smart_travel_guide
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-test-jwt-secret-please-change
  WEBHOOK_SECRET: ci-test-webhook-secret
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  # Lint + typecheck + unit/integration (vitest). Nhanh, chạy mọi PR.
  unit:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # E2E smoke (Playwright) — job RIÊNG để không làm chậm unit/integration.
  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
